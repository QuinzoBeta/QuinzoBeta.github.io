    background:radial-gradient(110% 60% at 15% 12%, color-mix(in srgb, var(--acc) 34%, transparent), transparent 62%), radial-gradient(90% 55% at 95% 100%, color-mix(in srgb, var(--acc) 20%, transparent), transparent 70%); }

  .metal{ --rx:0deg; --ry:0deg; --gx:30%; --gy:0%;

C/g%3E%3C/svg%3E"); }

  .metal.t-emerald .engr{ text-shadow:0 1px 0 rgba(240,255,180,.55), 0 -1px 0 rgba(10,30,0,.3), 0 0 10px rgba(230,255,120,.25); }
  .metal.t-emerald .chip{ filter:hue-rotate(35deg) saturate(1.4) brightness(1.05); }
  .metal.t-emerald .m-tier{ opacity:.85; }
  .tier-next .lock{ display:inline-block; width:12px; height:12px; vertical-align:-1px; margin-right:4px; }
  .tier-next.mystery span{ background:linear-gradient(90deg, var(--text) 0%, #c8ff2a 50%, var(--text) 100%); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:mysteryShine 2.8s linear infinite; }
  @keyframes mysteryShine{ 0%{ background-position:100% 0; } 100%{ background-position:-100% 0; } }
  .metal.t-platinum .m-tier{ opacity:.8; }
  .m-tier{ font-size:9px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; opacity:.7; margin-left:auto; margin-right:10px; }
  .metal.sweep-now::before{ animation:sweep 1.4s var(--ease) 1 both; }
  .tier-row{ margin-top:16px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tier-top{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .tier-top > span:nth-child(2){ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tier-top b{ color:var(--text); font-weight:800; }
  .tier-swatch{ width:14px; height:14px; border-radius:5px; flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), 0 1px 3px rgba(0,0,0,.3); }
  .tier-next{ margin-left:auto; font-weight:700; color:var(--text); white-space:nowrap; }
  .tier-track{ height:6px; border-radius:3px; background:var(--surface-3); margin-top:9px; overflow:hidden; position:relative; }
  .tier-track i{ position:absolute; left:0; top:0; bottom:0; border-radius:3px; transition:width .9s var(--ease); background-size:200% 100%; }
  .tier-track i::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); background-size:40% 100%; background-repeat:no-repeat; animation:trackShine 2.6s ease-in-out infinite; }
  @keyframes trackShine{ 0%{ background-position:-40% 0; } 60%,100%{ background-position:140% 0; } }
  .spark-fx{ position:fixed; z-index:50; pointer-events:none; width:10px; height:10px; clip-path:polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .tier-flash{ position:absolute; inset:0; border-radius:20px; pointer-events:none; z-index:3; background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.9), rgba(255,255,255,0) 60%); opacity:0; }
  .m-top{ display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1; }
  .m-brand{ display:flex; align-items:center; gap:6px; font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:-.01em; }
  .m-brand svg{ width:20px; height:20px; color:var(--ink); filter:drop-shadow(0 1px 0 var(--hi)); }
  .m-nfc{ width:22px; height:22px; color:var(--ink-soft); filter:drop-shadow(0 1px 0 var(--hi)); }
  .m-row{ display:flex; align-items:center; gap:14px; margin-top:12px; position:relative; z-index:1; }
  .chip{ width:44px; height:34px; border-radius:7px; flex:0 0 auto; position:relative; overflow:hidden;
    background:linear-gradient(135deg, #e3d3a2 0%, #b69c5e 45%, #eadcb0 70%, #c0a769 100%);
    box-shadow:inset 0 0 0 1px rgba(110,85,35,.35), 0 1px 0 rgba(255,255,255,.5); }
  .chip svg{ position:absolute; inset:0; width:100%; height:100%; }
  .m-status{ font-size:10px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; opacity:.7; }
  .m-amt{ font-family:var(--display); font-weight:800; font-size:38px; letter-spacing:-.02em; line-height:1; margin-top:auto; position:relative; z-index:1; color:var(--ink-strong); font-variant-numeric:tabular-nums; }
  .m-amt .cents{ font-size:.55em; opacity:.55; }
  .m-spark{ position:absolute; right:16px; top:38%; width:46%; height:30%; z-index:0; opacity:.9; }
  .m-spark svg{ display:block; width:100%; height:100%; overflow:visible; }
  .m-bottom{ display:flex; gap:16px; align-items:flex-end; margin-top:12px; position:relative; z-index:1; }
  .m-bottom > div:first-child{ flex:1; min-width:0; }
  .m-cap{ font-size:8.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; opacity:.55; }
  .m-name{ font-size:13px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .m-val{ font-size:13px; font-weight:800; letter-spacing:.06em; margin-top:3px; font-variant-numeric:tabular-nums; text-transform:uppercase; white-space:nowrap; }

  .split{ margin-top:18px; }
  .split-bar{ display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--surface-3); gap:2px; }
  .split-bar i{ display:block; height:100%; border-radius:3px; transition:width .5s var(--ease); }
  .split-legend{ display:flex; justify-content:space-between; margin-top:10px; font-size:12.5px; color:var(--muted); gap:10px; }
  .split-legend b{ font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
  .key{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:0; }

  .seg{ display:flex; gap:2px; padding:4px; margin-top:20px; border-radius:999px; background:var(--surface-2); }
  .seg button{ flex:1; border:none; background:none; color:var(--muted); font-size:14px; font-weight:700; padding:13px 6px; border-radius:999px; cursor:pointer; transition:background .2s, color .2s; }
  .seg button.active{ background:var(--text); color:var(--bg); }

<script>
var QSplash = (function () {
  var el = document.getElementById('splash'), t0 = Date.now(), ready = false, done = false, MIN = 820, CAP = 1200;
  el.className = 'sp-clock';
  void el.offsetWidth;
  el.classList.add('sp-in');
  function hide() {
    if (done) return; done = true;
    el.classList.add('sp-out');
    setTimeout(function () { el.hidden = true; }, 420);
  }
  function check() { if (!done && ready && Date.now() - t0 >= MIN) hide(); }
  setTimeout(check, MIN);
  setTimeout(hide, CAP);
  return { ready: function () { ready = true; check(); } };
})();
</script>

    tipMoneyNav: ['Novo: aba Dinheiro|Suas despesas agora moram aqui, junto com as Metas: diga pra que você está juntando e o Quinzo calcula quanto separar a cada dia de trabalho.', 'Nuevo: pestaña Dinero|Tus gastos ahora viven aquí, junto con las Metas: di para qué estás ahorrando y Quinzo calcula cuánto apartar cada día de trabajo.', 'New: Money tab|Your expenses now live here, together with Goals: tell Quinzo what you’re saving for and it works out how much to set aside each workday.'],
    tipHB1: ["Seu dinheiro do mês|Tudo o que você ganhou, somado sozinho. Em cima dá pra trocar o período: mês, 14 dias ou tudo.", "Tu dinero del mes|Todo lo que ganaste, sumado solo. Arriba puedes cambiar el período: mes, 14 días o todo.", "Your money this month|Everything you earned, added up for you. Switch the period above: month, 14 days or all."],
    tipHB2: ["Quanto ainda te devem|Pago é o que já caiu na sua conta. A caminho é o que as empresas ainda te devem.", "¿Cuánto te deben?|Pagado es lo que ya cayó en tu cuenta. En camino es lo que las empresas todavía te deben.", "What you’re still owed|Paid is what already hit your account. On the way is what companies still owe you."],
    tipHB3: ["Caiu o pagamento?|Toque em Recebi e todos os turnos dessa empresa ficam pagos de uma vez.", "¿Te pagaron?|Toca Recibí y todos los turnos de esa empresa quedan pagados de una vez.", "Got paid?|Tap Got paid and all of that company’s shifts are marked paid at once."],
    tipHB4: ["Começando a trabalhar?|Toque em Comecei e o cronômetro conta suas horas. Quando terminar, o turno é salvo com um toque.", "¿Empezando a trabajar?|Toca Empecé y el cronómetro cuenta tus horas. Al terminar, el turno se guarda con un toque.", "Starting work?|Tap Start and the timer counts your hours. When you finish, the shift is saved in one tap."],
    tipHB5: ["Anote cada dia de trabalho|Toque no + pra registrar um turno ou um gasto. Leva 10 segundos.", "Anota cada día de trabajo|Toca + para registrar un turno o un gasto. Toma 10 segundos.", "Log every workday|Tap + to add a shift or an expense. Takes 10 seconds."],
    tipMoneyNavNew: ["Aba Dinheiro|Seus gastos e suas Metas ficam aqui: diga pra que você está juntando e o Quinzo calcula quanto separar a cada dia de trabalho.", "Pestaña Dinero|Tus gastos y tus Metas viven aquí: di para qué estás ahorrando y Quinzo calcula cuánto apartar cada día de trabajo.", "Money tab|Your expenses and Goals live here: say what you’re saving for and Quinzo works out how much to set aside each workday."],
    tipMoney1: ['Para onde foi o dinheiro|Quanto você ganhou no mês, quanto foi em despesas, quanto guardou nas metas e quanto sobrou livre pra gastar.', 'A dónde fue el dinero|Cuánto ganaste en el mes, cuánto se fue en gastos, cuánto guardaste en metas y cuánto te queda libre.', 'Where the money went|What you earned this month, what went to expenses, what you saved to goals and what’s left free to spend.'],
    tipMoney2: ['Suas metas|Celular novo, viagem, casa… Crie uma meta com valor e prazo. O Quinzo diz quanto separar por dia trabalhado e avisa se estiver puxado demais.', 'Tus metas|Celular nuevo, viaje, casa… Crea una meta con monto y plazo. Quinzo te dice cuánto apartar por día trabajado y avisa si es demasiado.', 'Your goals|New phone, a trip, a home… Create a goal with an amount and a deadline. Quinzo tells you how much to set aside per workday and warns you if it’s too tight.'],
    tipGoal1: ['Quanto guardar|Esse é o valor por dia de trabalho pra chegar no prazo. Quinzena fraca? Ele sobe um pouco. Quinzena forte? Ele cai.', 'Cuánto guardar|Este es el monto por día de trabajo para llegar a tiempo. ¿Quincena floja? Sube un poco. ¿Quincena fuerte? Baja.', 'How much to save|This is the amount per workday to hit your deadline. Slow pay period? It goes up a little. Strong one? It drops.'],
    tipGoal2: ['Guardou? Anote aqui|O Quinzo não mexe no seu banco. Quando transferir pro savings, toque em Guardei. A barra enche e o app comemora a cada 25%.', '¿Guardaste? Anótalo aquí|Quinzo no toca tu banco. Cuando transfieras a tus ahorros, toca Guardé. La barra se llena y la app celebra cada 25%.', 'Saved some? Log it here|Quinzo never touches your bank. When you move money to savings, tap I saved. The bar fills up and the app celebrates every 25%.'],

    tipExp1: ['Seus gastos do trabalho|Uber, gasolina, ferramenta, aquele almoço que você comprou porque esqueceu a marmita… Tudo que sai do seu bolso por causa do trabalho fica aqui, somado sozinho.', 'Tus gastos del trabajo|Uber, gasolina, herramientas, ese almuerzo que compraste porque olvidaste la comida… Todo lo que sale de tu bolsillo por el trabajo queda aquí, sumado solo.', 'Your work expenses|Uber, gas, tools, that lunch you bought because you forgot yours at home… Everything work costs you lands here, added up for you.'],
    tipExp2: ['Anotar leva 5 segundos|Gastou alguma coisa? Toque no +, coloque o valor e escolha a categoria. Pronto.', 'Anotar toma 5 segundos|¿Gastaste algo? Toca +, pon el monto y elige la categoría. Listo.', 'Logging takes 5 seconds|Spent something? Tap +, enter the amount and pick a category. Done.'],
    tipExp3: ['E no fim da quinzena…|Em Gráficos você descobre quanto sobrou de verdade depois desses gastos. Spoiler: pode te surpreender.', 'Y al final de la quincena…|En Gráficos descubres cuánto te quedó de verdad después de estos gastos. Spoiler: te puede sorprender.', 'And at the end of the pay period…|Insights shows what you really kept after these costs. Spoiler: it might surprise you.'],
    tipCo1: ['Um cartão para cada chefe|Valor por hora, dia de pagamento e quanto ele ainda te deve. Tudo num lugar só.', 'Una tarjeta para cada jefe|Pago por hora, día de pago y cuánto te debe todavía. Todo en un solo lugar.', 'One card per boss|Hourly rate, payday and how much they still owe you. All in one place.'],
    tipCo2: ['Caiu o pagamento?|Toque em Recebi e os turnos dessa empresa ficam como pagos, sem marcar um por um.', '¿Llegó el pago?|Toca Recibí y los turnos de esa empresa quedan pagados, sin marcar uno por uno.', 'Got paid?|Tap Got paid and that company’s shifts are marked paid, no ticking them one by one.'],
    tipCo3: ['Mandar as horas pro chefe|Copie as horas dessa empresa prontinhas para o WhatsApp, ou gere um PDF.', 'Enviar las horas al jefe|Copia las horas de esa empresa listas para WhatsApp, o genera un PDF.', 'Send your hours to the boss|Copy that company’s hours ready for WhatsApp, or make a PDF.'],
    tipCo4: ['Trabalho novo?|Toque no + para adicionar outra empresa quando quiser.', '¿Trabajo nuevo?|Toca + para añadir otra empresa cuando quieras.', 'New job?|Tap + to add another company anytime.'],
    tipG1: ['O que sobrou de verdade|Sabe aquele dinheiro que some e você nem sabe para onde foi? Está aqui: tudo que você ganhou, menos Uber, gasolina e almoço. Esse é o seu dinheiro real.', 'Lo que te queda de verdad|¿Sabes ese dinero que desaparece y no sabes a dónde fue? Está aquí: todo lo que ganaste, menos Uber, gasolina y comida. Ese es tu dinero real.', 'What you actually kept|You know that money that vanishes and you never know where it went? Here it is: everything you earned, minus rides, gas and food. That’s your real money.'],
    tipG2: ['Do jeito que você recebe|Veja por quinzena ou pelo mês inteiro, e compare com o período anterior.', 'Como tú cobras|Mira por quincena o por mes, y compara con el período anterior.', 'The way you get paid|Switch between half-month and month, and compare with the last one.'],

    tipG4: ['Seu ganho real por hora|Já tirando as despesas. Às vezes a empresa que paga mais por hora não é a que mais deixa no seu bolso.', 'Tu ganancia real por hora|Ya sin gastos. A veces la empresa que más paga por hora no es la que más deja en tu bolsillo.', 'Your real hourly pay|After expenses. Sometimes the job with the best rate isn’t the one that leaves the most in your pocket.'],

    else if (isIOS) steps = [t(/CriOS|FxiOS|EdgiOS/.test(UA) ? 'igIosC1' : 'igIos1', { s: '<span class=\"ig-ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 15V3.5M8 7.5l4-4 4 4\"/><path d=\"M8.5 10.5H6.5a1.5 1.5 0 0 0-1.5 1.5v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5h-2\"/></svg></span>' }), t('igIos2', { p: '<span class=\"ig-ic dark\"><svg viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"4\"/><path d=\"M12 8.5v7M8.5 12h7\"/></svg></span>' }), t('igIos3')];
    else if (!deferredPrompt) steps = [t('igAnd1', { m: '<span class=\"ig-ic dark\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"5.5\" r=\"1\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/><circle cx=\"12\" cy=\"18.5\" r=\"1\"/></svg></span>' }), t('igAnd2'), t('igAnd3')];
    $('igSteps').innerHTML = steps.map(function (s) { return '<li><span>' + s + '</span></li>'; }).join('');
    $('igSteps').hidden = !steps.length;
    $('igInstall').hidden = !(deferredPrompt && !inApp);
    $('igInstall').textContent = t('igInstallBtn');
    $('igCopy').hidden = !inApp;
    $('igCopy').textContent = t('igCopy');
    $('igSkip').textContent = t('igSkip');
    $('igNote').textContent = t('igNote');
    $('igLang').querySelectorAll('[data-v]').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === prefs.lang); });
  }
  var gateCb = null;
  function openGate(cb) { gateCb = cb || null; renderGate(); $('installGate').hidden = false; document.body.style.overflow = 'hidden'; }
  function closeGate() {
    $('installGate').hidden = true; document.body.style.overflow = '';
    var cb = gateCb; gateCb = null; if (cb) cb();
  }
  function setupGate() {
    $('igLang').addEventListener('click', function (ev) {
      var x = ev.target.closest('[data-v]'); if (!x) return;
      prefs.lang = x.getAttribute('data-v');
      try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
      try { var u = new URL(location.href); u.searchParams.set('lang', prefs.lang); history.replaceState(history.state, '', u.toString()); } catch (e) {}
      applyPrefs(); renderGate(); renderAll();
    });
    $('igSkip').addEventListener('click', function () { try { localStorage.setItem(GATE_KEY, '1'); } catch (e) {} closeGate(); });
    $('igInstall').addEventListener('click', function () {
      if (!deferredPrompt) return;
      var p = deferredPrompt; deferredPrompt = null;
      p.prompt();
      (p.userChoice || Promise.resolve({})).then(function (r) {
        if (r && r.outcome === 'accepted') { $('igSteps').innerHTML = ''; $('igInstall').hidden = true; $('igSub').textContent = t('igDone'); }
        else renderGate();
      });
    });
    $('igCopy').addEventListener('click', function () {
      var url = location.href.split('#')[0], b = $('igCopy');
      function ok() { b.textContent = t('igCopied'); setTimeout(function () { b.textContent = t('igCopy'); }, 1800); }
      try { navigator.clipboard.writeText(url).then(ok, function () { if (fallbackCopy(url)) ok(); }); } catch (e) { if (fallbackCopy(url)) ok(); }
    });
    $('pInstall').addEventListener('click', function () { closeSheets(); setTimeout(function () { openGate(); }, 250); });
    $('pFeedback').addEventListener('click', function () {
      var txt = encodeURIComponent(t('fbText'));
      var url = 'https://wa.me/' + (FB_PHONE ? FB_PHONE : '') + '?text=' + txt;
      try { window.open(url, '_blank'); } catch (e) { location.href = url; }
    });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  }
  function syncThemeColor() {
    var m = $('themeColor'); if (!m) return;
    var c = getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#000000';
    m.setAttribute('content', c);
    document.documentElement.style.background = c;
  }

  function init() {
    loadTimer();
    applyPrefs();
    setupMetal();
    document.querySelectorAll('.nav-btn').forEach(function (b) { b.addEventListener('click', function () { setView(b.getAttribute('data-view')); }); });
    $('fab').addEventListener('click', function () {
      if (view === 'despesas') openExpense(null, inMonth(isoDate(today()), month) ? null : isoDate(month));
      else if (view === 'empresas') openCompany(null);
      else if (view === 'calendario') openShift(null, selDay);
      else setFabMenu($('fabMenu').hidden);
    });
    $('fabBackdrop').addEventListener('click', function () { setFabMenu(false); });
    $('fabMenu').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-add]'); if (!b) return;
      setFabMenu(false);
      var k = b.getAttribute('data-add');
      if (k === 'shift') openShift(null); else if (k === 'timer') toggleTimer(); else openExpense(null);
    });
    $('avatarBtn').addEventListener('click', function () { openPrefs(false); });
    $('bellBtn').addEventListener('click', openPaySheet);
    $('brief').addEventListener('click', openWeek);
    $('eyeBtn').addEventListener('click', toggleDiscreet);
    $('payList').addEventListener('click', function (ev) { var b = ev.target.closest('[data-act]'); if (!b) return; onInboxAct(+b.getAttribute('data-in'), b.getAttribute('data-act')); });
    $('weekSheet').addEventListener('click', function (ev) {
      var nv = ev.target.closest('[data-wk]'); if (nv) { if (nv.disabled) return; wkStart = isoDate(addDays(parseD(wkStart), 7 * +nv.getAttribute('data-wk'))); renderWeek(); return; }
      var it = ev.target.closest('[data-eid]'); if (it) { var e = S.entries.find(function (x) { return x.id === it.getAttribute('data-eid'); }); if (e) openShift(e); return; }
      var ad = ev.target.closest('[data-add]'); if (ad) openShift(null, ad.getAttribute('data-add'));
    });
    $('wkSend').addEventListener('click', sendWeek);
    $('recap').addEventListener('click', onRecapTap);
    $('qaExp').addEventListener('click', function () { openExpense(null); });
    $('qaSelect').addEventListener('click', function () { toggleSelection(); });
    $('qaCopy').addEventListener('click', openCopy);
    $('kCompanies').addEventListener('click', function (ev) { var b = ev.target.closest('[data-co]'); if (!b) return; K.company = b.getAttribute('data-co'); renderCopy(); });
    $('kRange').addEventListener('click', function (ev) { var b = ev.target.closest('[data-v]'); if (!b) return; K.range = b.getAttribute('data-v'); renderCopy(); });
    $('kLang').addEventListener('click', function (ev) { var b = ev.target.closest('[data-v]'); if (!b) return; prefs.copyLang = b.getAttribute('data-v'); savePrefs(); renderCopy(); });
    $('kMoney').addEventListener('click', function (ev) { var b = ev.target.closest('[data-v]'); if (!b) return; prefs.copyMoney = b.getAttribute('data-v') === '1'; savePrefs(); renderCopy(); });
    ['kFrom', 'kTo'].forEach(function (id) { $(id).addEventListener('change', renderCopy); });
    $('kCopy').addEventListener('click', doCopy);
    $('kShare').addEventListener('click', doShare);
    $('kPdf').addEventListener('click', doPdf);
    $('overlay').addEventListener('click', function () { if (sheetLocked()) return; closeSheets(); });
    window.addEventListener('popstate', function () {
      if (ignorePop) { ignorePop = false; return; }
      layerPushed = false;
      dismissTop();
      if (anyLayer()) pushLayer();
    });
    document.addEventListener('keydown', function (ev) {
      if (rc && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) { showSlide(rc.i + (ev.key === 'ArrowRight' ? 1 : -1)); return; }
      if (ev.key !== 'Escape') return;
      if (dismissTop()) ev.preventDefault();
    });
    document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', onCloseBtn); });
    $('obAdd').addEventListener('click', function () { openCompany(null); });
    $('obNext').addEventListener('click', obToShift);
    $('qaTimer').addEventListener('click', toggleTimer);
    $('tcStop').addEventListener('click', stopTimer);
    $('tcDiscard').addEventListener('click', discardTimer);
    $('tGo').addEventListener('click', startTimer);
    $('tChips').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-co],[data-new]'); if (!b) return;
      if (b.hasAttribute('data-new')) { tNewMode = true; $('tCompany').value = ''; renderTimerChips(); $('tCompany').focus(); return; }
      tNewMode = false; $('tCompany').value = b.getAttribute('data-co'); $('tError').hidden = true; renderTimerChips();
    });
    setInterval(function () { if (timer) { if (view === 'turnos') { $('tcTime').textContent = elapsed(timer.start); $('tcWarn').hidden = (Date.now() - timer.start) < 14 * 3600e3; if (!$('tcWarn').hidden) $('tcWarn').textContent = t('timerLong', { h: 14 }); } $('qaTimerLbl').textContent = elapsed(timer.start).replace(/:\d\d$/, ''); } }, 1000);
    document.querySelectorAll('.month-nav button').forEach(function (b) {
      b.addEventListener('click', function () {
        var dir = +b.getAttribute('data-dir'); gSel = null;
        if (b.closest('#gNav') && gMode === 'q') { gAnchor = qShift(gAnchor, dir); renderAll(); return; }
        month = new Date(month.getFullYear(), month.getMonth() + dir, 1); renderAll();
      });
    });
    $('gMode').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-v]'); if (!b) return;
      var m = b.getAttribute('data-v'); if (m === gMode) return;
      if (m === 'm') month = startOfMonth(gAnchor); else gAnchor = (monthKey(month) === monthKey(today())) ? qStart(today()) : new Date(month.getFullYear(), month.getMonth(), 1);
      gMode = m; gSel = null; renderAll();
    });

    $('saveBtn').addEventListener('click', saveShift);
    $('deleteBtn').addEventListener('click', function () { var id = editShiftId; closeSheets(); if (id) removeWithUndo('entries', id, 'shiftDeleted'); });
    $('fChips').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-co],[data-new]'); if (!b) return;
      if (b.hasAttribute('data-new')) { fNewMode = true; $('fCompany').value = ''; $('fRate').value = ''; updateCalcHint(); renderShiftChips(); $('fCompany').focus(); return; }
      var n = b.getAttribute('data-co'); fNewMode = false; $('fCompany').value = n;
      if (!editShiftId) applyCompanyDefaults(n);
      else if (!$('fRate').value) { $('fRate').value = defaultRate(n); updateCalcHint(); }
      renderShiftChips(); $('formError').hidden = true;
    });
    $('fDateQuick').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-d]'); if (!b) return;
      $('fDate').value = isoDate(addDays(today(), +b.getAttribute('data-d'))); markDateQuick();
    });
    $('fDate').addEventListener('change', markDateQuick);
    ['fIn', 'fOut', 'fBreak', 'fRate'].forEach(function (id) { $(id).addEventListener('input', function () { longConfirmed = false; rateConfirmed = false; $('formError').hidden = true; }); });
    $('xAmount').addEventListener('input', function () { expConfirmed = false; $('xError').hidden = true; });
    $('adjToggle').addEventListener('click', function () {
      adjState.open = !adjState.open;
      if (adjState.open && $('adjPaid').value === '') $('adjPaid').value = loggedHours() || '';
      renderAdj();
    });
    $('adjPaid').addEventListener('input', function () { adjState.on = $('adjPaid').value !== ''; renderAdj(); });
    $('adjReasons').addEventListener('click', function (ev) { var b = ev.target.closest('[data-r]'); if (!b) return; adjState.reason = b.getAttribute('data-r'); adjState.on = true; renderAdj(); });
    $('adjRemove').addEventListener('click', function () { adjState = { on: false, open: false, reason: 'late' }; $('adjPaid').value = ''; $('adjNote').value = ''; renderAdj(); });
    ['fIn', 'fOut', 'fBreak', 'fRate'].forEach(function (id) { $(id).addEventListener('input', function () { if (!$('adjWrap').hidden) renderAdj(); }); });
    $('dedToggle').addEventListener('click', function () { dedOpen = !dedOpen; renderDeds(); });
    $('dedAdd').addEventListener('click', function () {
      var amt = parseFloat($('dedAmt').value), dt = $('dedDate').value;
      if (isNaN(amt) || amt <= 0 || !dt) { $('cError').textContent = t('errDed'); $('cError').hidden = false; return; }
      $('cError').hidden = true;
      compDeds.push({ id: uid(), date: dt, amount: Math.round(amt * 100) / 100, note: $('dedNote').value.trim(), settled: false });
      $('dedAmt').value = ''; $('dedNote').value = '';
      renderDeds();
    });
    $('dedList').addEventListener('click', function (ev) { var b = ev.target.closest('[data-del]'); if (!b) return; var id = b.getAttribute('data-del'); compDeds = compDeds.filter(function (d) { return d.id !== id; }); renderDeds(); });
    $('toastUndo').addEventListener('click', function () { var fn = toastUndoFn; toastUndoFn = null; $('toast').hidden = true; if (fn) fn(); });
    ['fIn', 'fOut', 'fBreak', 'fRate'].forEach(function (id) { $(id).addEventListener('input', updateCalcHint); });
    $('fCompany').addEventListener('change', function () {
      var r = defaultRate(this.value.trim());
      if (r !== '' && !$('fRate').value) { $('fRate').value = r; updateCalcHint(); }
    });
    $('statusToggle').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-v]'); if (!b) return;
      setStatusToggle(b.getAttribute('data-v') === 'true');
    });

    $('xSave').addEventListener('click', saveExpense);
    $('goalAddBtn').addEventListener('click', function () { openGoal(null); });
    $('goalList').addEventListener('click', function (ev) {
      if (ev.target.closest('#goalEmptyBtn')) { openGoal(null); return; }
      var sb = ev.target.closest('[data-save]'); if (sb) { ev.stopPropagation(); openDeposit(sb.getAttribute('data-save')); return; }
      var c = ev.target.closest('[data-g]'); if (!c) return;
      var g = goalById(c.getAttribute('data-g')); if (!g) return;
      var p = goalPlan(g, incomeModel());
      if (p.overdue || p.done) openGoal(g); else openDeposit(g.id);
    });
    $('gIcons').addEventListener('click', function (ev) { var b = ev.target.closest('[data-gi]'); if (!b) return; gIconSel = b.getAttribute('data-gi'); gIconTouched = true; renderGoalIcons(); });
    $('gName').addEventListener('input', function () {
      if (gIconTouched) return;
      var v = this.value, k = 'star';
      for (var i = 0; i < GICON_GUESS.length; i++) if (GICON_GUESS[i][0].test(v)) { k = GICON_GUESS[i][1]; break; }
      if (k !== gIconSel) { gIconSel = k; renderGoalIcons(); }
    });
    $('gModeT').addEventListener('click', function (ev) { var b = ev.target.closest('[data-v]'); if (b) setGoalMode(b.getAttribute('data-v')); });
    ['gTarget', 'gHave', 'gDate', 'gPct'].forEach(function (id) { $(id).addEventListener('input', renderGoalPreview); $(id).addEventListener('change', renderGoalPreview); });
    $('gPctQuick').addEventListener('click', function (ev) { var b = ev.target.closest('[data-p]'); if (!b) return; $('gPct').value = b.getAttribute('data-p'); renderGoalPreview(); });
    $('gPreview').addEventListener('click', function (ev) { var b = ev.target.closest('[data-sug]'); if (!b) return; $('gDate').value = b.getAttribute('data-sug'); haptic(); renderGoalPreview(); });
    $('gSave').addEventListener('click', saveGoal);
    $('gDelete').addEventListener('click', function () { var id = editGoalId; closeSheets(); if (id) removeWithUndo('goals', id, 'goalDeleted'); });
    $('depModeT').addEventListener('click', function (ev) { var b = ev.target.closest('[data-v]'); if (!b) return; depDir = +b.getAttribute('data-v'); $('dAmount').value = ''; $('dError').hidden = true; renderDepSheet(depDir > 0); });
    $('dQuick').addEventListener('click', function (ev) { var b = ev.target.closest('[data-amt]'); if (!b) return; $('dAmount').value = b.getAttribute('data-amt'); $('dError').hidden = true; });
    $('dLog').addEventListener('click', function (ev) { var b = ev.target.closest('[data-rm]'); if (b) removeDeposit(b.getAttribute('data-rm')); });
    $('dSave').addEventListener('click', saveDeposit);
    $('dEdit').addEventListener('click', function () { var g = goalById(depGoalId); if (g) openGoal(g); });
    $('xDelete').addEventListener('click', function () { var id = editExpId; closeSheets(); if (id) removeWithUndo('expenses', id, 'expDeleted'); });
    $('xCats').addEventListener('click', function (ev) { var b = ev.target.closest('[data-cat]'); if (!b) return; expCat = b.getAttribute('data-cat'); renderCatChips(); });

    $('cSave').addEventListener('click', saveCompany);
    $('cSchedule').addEventListener('change', toggleScheduleFields);
    $('cDelete').addEventListener('click', function () {
      var id = editCompId, name = editCompOrig;
      var hasE = !!name && S.entries.some(function (e) { return e.company === name; });
      closeSheets();
      if (hasE) setArchived(name, true); else if (id) removeWithUndo('companies', id, 'compDeleted');
    });

    $('pMode').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-v]'); if (!b) return;
      prefs.mode = b.getAttribute('data-v'); markGroup('pMode', prefs.mode); savePrefs(); applyPrefs(); refreshPrefSheetText();
    });
    $('pClock').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-v]'); if (!b) return;
      prefs.clock24 = b.getAttribute('data-v') === '24'; markGroup('pClock', prefs.clock24 ? '24' : '12'); savePrefs(); renderAll();
    });
    $('pLang').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-v]'); if (!b) return;
      prefs.lang = b.getAttribute('data-v'); markGroup('pLang', prefs.lang); savePrefs();
      applyPrefs(); refreshPrefSheetText(); renderAll();
    });
    $('pSave').addEventListener('click', savePrefSheet);
    $('pGoal').addEventListener('change', function () { var v = Math.round(+this.value); if (v >= 100) { prefs.goal = v; savePrefs(); renderGoalField(); renderAll(); } else renderGoalField(); });
    $('pTierQuick').addEventListener('click', function (ev) { var b = ev.target.closest('[data-v]'); if (!b) return; prefs.tierOff = b.getAttribute('data-v') === 'off'; savePrefs(); renderGoalField(); renderAll(); });
    $('tierRow').addEventListener('click', function () { openPrefs(false); setTimeout(function () { $('goalField').scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 350); });
    $('pTips').addEventListener('click', function () { prefs.tips = {}; savePrefs(); closeSheets(); toast(t('tipsReset')); });
    $('coachNext').addEventListener('click', nextTip);
    $('coachSkip').addEventListener('click', function () { endTips(true); });
    window.addEventListener('scroll', onViewportMove, { passive: true, capture: true });
    window.addEventListener('resize', onViewportMove);
    $('pPhoto').addEventListener('change', function () {
      var f = this.files && this.files[0]; this.value = '';
      if (!f) return;
      readPhoto(f).then(function (data) {
        prefs.photo = data; $('pPhotoErr').hidden = true;
        try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
        if (prefs.onboarded) savePrefs();
        applyPrefs(); refreshPhotoRow();
      }).catch(function () { $('pPhotoErr').textContent = t('photoErr'); $('pPhotoErr').hidden = false; });
    });
    $('pPhotoDel').addEventListener('click', function () { prefs.photo = ''; savePrefs(); applyPrefs(); refreshPhotoRow(); });
    $('pName').addEventListener('input', function () { if (!prefs.photo) refreshPhotoRow(); });

    $('chips').addEventListener('click', function (ev) {
      var c = ev.target.closest('[data-period]'); if (!c) return;
      currentPeriod = c.getAttribute('data-period'); renderTurnos();
    });
    $('statusTabs').addEventListener('click', function (ev) {
      var tb = ev.target.closest('[data-status]'); if (!tb) return;
      document.querySelectorAll('#statusTabs button').forEach(function (x) { x.classList.remove('active'); });
      tb.classList.add('active'); currentStatus = tb.getAttribute('data-status'); renderTurnos();
    });
    $('clearCompanyFilter').addEventListener('click', function () { companyFilter = null; renderTurnos(); });
    $('selCancelBtn').addEventListener('click', function () { toggleSelection(false); });
    $('selMarkPaidBtn').addEventListener('click', function () { bulkSetPaid(true); });
    $('selMarkUnpaidBtn').addEventListener('click', function () { bulkSetPaid(false); });

    setupGate();
    renderAll();
    if (!prefs.onboarded && canInstall() && !gateSkipped()) openGate(function () { openPrefs(true); });
    else if (!prefs.onboarded) openPrefs(true);

    function fallback() { profileReady = true; loadLocal(); entriesReady = true; renderAll(); QSplash.ready(); }
    fallback();
  }

  init();
})();
</script>
